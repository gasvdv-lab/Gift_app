<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Gift AR v0.1.0</title>
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <main class="app-shell">
    <section class="card" aria-labelledby="app-title">
      <div class="badge">Gift AR</div>
      <h1 id="app-title">AR-cadeauplatform</h1>
      <p class="lead">Technische basis v0.1.0</p>

      <div id="status" class="status" role="status" aria-live="polite">
        App wordt gestart…
      </div>

      <div class="actions">
        <button id="btnSelfTest" type="button">Voer basistest uit</button>
        <button id="btnReset" type="button" class="secondary">Reset status</button>
      </div>

      <details>
        <summary>Versie-informatie</summary>
        <dl>
          <div><dt>Versie</dt><dd id="versionValue">—</dd></div>
          <div><dt>Platform</dt><dd id="platformValue">—</dd></div>
          <div><dt>Modules</dt><dd id="moduleValue">—</dd></div>
        </dl>
      </details>
    </section>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
